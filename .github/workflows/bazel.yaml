name: bazel

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Cache bazel
        uses: actions/cache@v4
        with:
          # Only the disk and repository caches — NOT ~/.cache/bazel
          # wholesale, which is also Bazel's default output_user_root
          # and would balloon every cache entry with multi-GB
          # non-reusable output bases (see the startup flag below).
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'examples/bazel/MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: Configure bazel caches
        # A user-level bazelrc reaches both workspaces this job builds
        # (the repo root and examples/bazel). Output bases go to /tmp
        # so the cached paths carry only reusable state.
        run: |
          cat >~/.bazelrc <<EOF
          startup --output_user_root=/tmp/bazel-out
          common --repository_cache=$HOME/.cache/bazel-repo
          build --disk_cache=$HOME/.cache/bazel-disk
          EOF
      - name: Build BUILD graph (binary + every generated target)
        # //... validates the whole gazelle-generated graph — including
        # go_test compile targets — without running tests (the Go test
        # suite runs under the toolchain in ci.yaml; the BUILD tree is
        # build-supported, and running the fixture-heavy engine tests
        # inside the bazel sandbox is not a supported configuration).
        run: bazel build //...
      - name: Example e2e
        run: cd examples/bazel && ./e2e.sh
      - name: C1-shaped config parity e2e
        run: cd examples/bazel && ./e2e_c1parity.sh
